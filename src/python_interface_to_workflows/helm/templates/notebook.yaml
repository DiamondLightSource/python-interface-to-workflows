apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: notebook
  labels:
    workflows.diamond.ac.uk/science-group-examples: "true"
  annotations:
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/python-interface-to-workflows"
spec:
  entrypoint: notebook
  volumeClaimTemplates:
    - metadata:
        name: tmp
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
        storageClassName: netapp
  podResources:
    requests:
      cpu: 600m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSpecPatch: |
    containers:
      - name: main
        resources:
          limits:
            memory: "1Gi"
  templates:
    - name: mount-files
      script:
        image: docker.io/library/python:bookworm
        command: [bash]
        source: |
          echo '{{ .Files.Get "notebooks/pandas.ipynb" | b64enc }}' | base64 -d > /tmp/notebook.ipynb
          echo '{{ .Files.Get "notebooks/requirements.txt" | b64enc }}' | base64 -d > /tmp/requirements.txt
        volumeMounts:
          - name: tmp
            mountPath: /tmp
    - name: convert-notebook
      podSpecPatch: '{"containers":[{"name":"main", "resources":{"limits":{"cpu": "600m"}}}]}'
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        - effect: NoSchedule
          key: nodetype
          operator: Equal
          value: gpu
        - effect: NoSchedule
          key: nodegroup
          operator: Equal
          value: workflows
      script:
        image: docker.io/library/python:bookworm
        command: [bash]
        source: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -r /tmp/requirements.txt
          /tmp/venv/bin/python -m ipykernel install --prefix=/tmp/venv --name=venv
          /tmp/venv/bin/python -m jupyter nbconvert --execute --allow-errors --to html --output notebook --output-dir /tmp /tmp/notebook.ipynb
        volumeMounts:
          - name: tmp
            mountPath: /tmp
      outputs:
        artifacts:
          - name: notebook
            path: /tmp/notebook.html
            archive:
              none: {}

    - name: notebook
      dag:
        tasks:
          - name: files
            template: mount-files
          - name: convert
            template: convert-notebook
            dependencies: [files]
